# Example consumer workflow for Chainsaw Guard.
#
# Copy this file to `.github/workflows/chainsaw.yml` in your repo, open
# a PR, and the Action will post a findings comment within ~30 seconds.
#
# Flip `mode: block` and wire this job as a required status check on
# your branch protection rule once you're ready to enforce.
name: Chainsaw Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  chainsaw-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Required. At the default depth of 1 the PR base commit is not in
          # the checkout, so `chainsaw pr-scan` has nothing to diff against
          # and the dependency changes in the PR go uninspected.
          fetch-depth: 0

      - name: Package security scan
        # Pin to a full commit SHA in production (`@<40-hex sha> # action-v1.x.y`).
        # A tag can be moved to another commit, and every workflow on it then
        # runs that commit: xygeni-action@v5 and trivy-action, 2026-03.
        # `chainsaw scan-actions --fail-on medium` flags unpinned refs.
        uses: Chain305/chainsaw-core/enforcement/github-actions@1c4b6342b7bc94a7a200243d461970e32061d1e4 # v0.22.123
        with:
          mode: warn           # warn | block
          # Uncomment to attest to a control plane:
          # server: ${{ secrets.CHAINSAW_SERVER }}
          # token:  ${{ secrets.CHAINSAW_TOKEN }}
          # attest: true
          scan-repo: true
          # Which pr-scan exit code fails the job in block mode.
          # "block" (default) = exit 20 (blocking finding) or 30 (a manifest
          # failed to parse). "warn" also fails on exit 10, which fires on
          # every PR that adds a dependency — opt in deliberately.
          pr-scan-fail-on: block
